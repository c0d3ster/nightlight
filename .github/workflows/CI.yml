name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: for f in *.sh lib/*.sh test/*.sh test/bin/gh; do bash -n "$f" || exit 1; done
      - name: Run tests
        run: bash test/run.sh
